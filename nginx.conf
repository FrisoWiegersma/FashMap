# FashMap's static site: nginx's default server plus one rule. index.html is revalidated on every load, so after a
# redeploy no browser keeps an old page that points at hashed files the new build no longer has.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
